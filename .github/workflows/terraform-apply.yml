name: Terraform Apply

on:
  push:
    branches:
      - main
    paths:
      - "foundation/**"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-production
  cancel-in-progress: false

defaults:
  run:
    working-directory: foundation

env:
  TF_IN_AUTOMATION: "true"
  AWS_REGION: ap-northeast-1

jobs:
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6

      - name: Terraform format check
        run: terraform fmt -check

      - name: Initialize TFLint
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run TFLint
        run: tflint --format compact

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: "arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/cloudcontent-github-actions"
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: cloudcontent-apply-${{ github.run_id }}
          allowed-account-ids: "${{ vars.AWS_ACCOUNT_ID }}"

      - name: Terraform init
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
        run: |
          : "${TF_STATE_BUCKET:?Set GitHub Variable TF_STATE_BUCKET}"
          : "${TF_STATE_KEY:?Set GitHub Variable TF_STATE_KEY}"
          terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="key=$TF_STATE_KEY" -backend-config="encrypt=true"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        run: terraform apply -input=false tfplan
