name: Terraform Plan

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  AWS_REGION: ap-northeast-1

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    # PRs de forks públicos não recebem acesso ao nosso fluxo autenticado.
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6

      - name: Terraform format check
        run: terraform fmt -check

      - name: Initialize TFLint
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run TFLint
        run: tflint --format compact

      - name: Configure AWS credentials for plan
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: "arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/cloudcontent-github-plan"
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: cloudcontent-plan-${{ github.run_id }}
          allowed-account-ids: "${{ vars.AWS_ACCOUNT_ID }}"

      - name: Terraform init
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -no-color -lock-timeout=5m
